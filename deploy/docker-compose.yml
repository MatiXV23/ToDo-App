# ToDoApp en producción. En el servidor solo viven este archivo y .env:
# la imagen se construye en otra máquina y se carga con scripts/deploy.sh.
name: todoapp

x-app: &app
  image: ${TODOAPP_IMAGE:-todoapp:latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-todoapp}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-todoapp}
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todoapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica migraciones pendientes y termina. web y worker esperan a que salga bien.
  migrate:
    <<: *app
    command: ["node", "dist/migrate.cjs"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    container_name: todoapp-web
    command: ["node", "server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [default, web]
    volumes:
      - uploads:/data/uploads
    # Acceso directo opcional desde la LAN (el login con Google necesita el dominio público).
    ports:
      - "${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "dist/worker.cjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  # Imágenes adjuntas a las tareas.
  uploads:

networks:
  # Red compartida con el Caddy del servidor (docker network create web).
  web:
    external: true
