<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sin conexión · ToDoApp</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f7f7f8;
        color: #171717;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        background: #fff;
        text-align: center;
      }
      svg { width: 48px; height: 48px; }
      h1 { margin: 16px 0 4px; font-size: 18px; }
      p { margin: 0 0 24px; color: #737373; }
      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: #171717;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3b82f6" />
            <stop offset="1" stop-color="#4f46e5" />
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#bg)" />
        <rect x="10.5" y="11.5" width="11" height="30" rx="3.5" fill="#fff" />
        <rect x="25" y="11.5" width="11" height="21" rx="3.5" fill="#fff" fill-opacity="0.75" />
        <rect x="39.5" y="11.5" width="11" height="12" rx="3.5" fill="#fff" fill-opacity="0.5" />
        <circle cx="43" cy="42" r="11" fill="#fff" />
        <path d="M38 42.3l3.4 3.4 6.6-7" fill="none" stroke="#4338ca" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Sin conexión</h1>
      <p>ToDoApp necesita internet para mostrar tus tableros. Revisá la conexión y probá de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
